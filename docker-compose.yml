services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
    - pgdata:/var/lib/postgresql/data
  app:
    build: .
    ports:
    - 8000:8000
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
    depends_on:
    - db
volumes:
  pgdata: null
